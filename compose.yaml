name: advohq-case-research
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/research.sqlite3
      HF_HOME: /data/huggingface
      QDRANT_URL: http://qdrant:6333
    volumes:
      - research_data:/data
      - ./imports:/imports:ro
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      - qdrant
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.16.3
    volumes:
      - vector_data:/qdrant/storage
    restart: unless-stopped
volumes:
  research_data:
  vector_data:
